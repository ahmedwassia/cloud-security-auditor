[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-security-auditor"
version = "0.1.0"
description = "Cloud and Kubernetes security posture auditing CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "boto3>=1.34,<2",
  "click>=8.1,<9",
  "jinja2>=3.1,<4",
  "kubernetes>=29,<34",
  "PyYAML>=6,<7",
  "rich>=13,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
cloud-security-auditor = "cloud_security_auditor.cli:main"

[tool.setuptools.packages.find]
include = ["cloud_security_auditor*"]

[tool.setuptools.package-data]
"cloud_security_auditor.aws" = ["mock_data.json"]
"cloud_security_auditor.reporter" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

